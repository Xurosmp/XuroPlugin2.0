      - name: Projekt entpacken und ins Repo committen
        if: hashFiles('pom.xml') == ''
        run: |
          base64 -d /tmp/p.b64 > /tmp/p.zip
          unzip -o /tmp/p.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "SMPCore Projekt erzeugt" || true
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Build
        run: mvn -B -ntp package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMPCore
          path: target/SMPCore.jar

      - name: Release (Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/SMPCore.jar
          generate_release_notes: true

      - name: Rolling release "latest"
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest target/SMPCore.jar \
            --title "Latest Build" \
            --notes "Automatischer Build von Commit $(git rev-parse HEAD)" \
            --prerelease \
            --target "$(git rev-parse HEAD)"
