# ============================================================
#  SMPCore - EINE Datei, die alles selbst erzeugt.
#  Speichern unter:  .github/workflows/build.yml
#  Beim ersten Lauf entpackt sie das komplette Plugin-Projekt ins Repo,
#  baut die JAR und legt sie unter Releases -> "Latest Build" ab.
# ============================================================
name: Build SMPCore

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

